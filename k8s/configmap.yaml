apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: computer-shop
data:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: shop
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: computer-shop
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    rule_files:
      - /etc/prometheus/rules/alert_rules.yml

    scrape_configs:
      - job_name: "api-gateway"
        static_configs:
          - targets: ["api-gateway:8080"]

      - job_name: "auth-service"
        static_configs:
          - targets: ["auth-service:8080"]

      - job_name: "user-service"
        static_configs:
          - targets: ["user-service:8080"]

      - job_name: "product-service"
        static_configs:
          - targets: ["product-service:8080"]

      - job_name: "order-service"
        static_configs:
          - targets: ["order-service:8080"]

      - job_name: "payment-service"
        static_configs:
          - targets: ["payment-service:8080"]

      - job_name: "notification-service"
        static_configs:
          - targets: ["notification-service:8080"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: computer-shop
data:
  alert_rules.yml: |
    groups:
      - name: microservices-alerts
        rules:
          - alert: ServiceDown
            expr: up == 0
            for: 30s
            labels:
              severity: critical
            annotations:
              summary: "Service is down"
              description: "Prometheus cannot scrape one of the services."

          - alert: OrderServiceDown
            expr: up{job="order-service"} == 0
            for: 30s
            labels:
              severity: critical
            annotations:
              summary: "Order Service is down"
              description: "Order Service is unavailable. Order creation may fail."
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: computer-shop
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
