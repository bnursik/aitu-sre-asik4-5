server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /gateway-health {
        proxy_pass http://api-gateway:8080/health;
    }

    location /api/ {
        proxy_pass http://api-gateway:8080/api/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
